<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek Harga Barang</title>
<!-- Menggunakan library ZXing untuk scan -->
<script src="https://unpkg.com/@zxing/library@latest"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 16px;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, #2563eb, #1e40af);
    color: #fff;
    padding: 18px 20px;
    text-align: center;
  }
  header h1 { font-size: 20px; font-weight: 600; }
  header p { font-size: 13px; opacity: 0.9; margin-top: 4px; }

  /* ===== Scanner Modal ===== */
  .scanner-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .scanner-modal.show { display: flex; }
  .scanner-box {
    width: 100%;
    height: 100%;
    background: #000;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .scanner-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: #111;
    color: #fff;
    font-size: 14px;
    z-index: 10;
  }
  .scanner-header button {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    line-height: 1;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .scanner-header button:hover { background: rgba(255,255,255,0.15); }
  
  .video-wrap {
    position: relative;
    flex: 1;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #video { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
  }

  /* ===== Kotak panduan scan ===== */
  .scan-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .scan-frame {
    width: 85%;
    height: 40%;
    border: 3px solid #22c55e;
    border-radius: 16px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
    position: relative;
  }
  .scan-hint {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 13px;
    background: rgba(0,0,0,0.7);
    padding: 8px 16px;
    border-radius: 20px;
    white-space: nowrap;
  }

  /* ===== Form ===== */
  .form-section { padding: 16px; }
  .form-group { margin-bottom: 12px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 12px;
    border: 1.5px solid #d1d5db;
    border-radius: 10px;
    font-size: 15px;
    transition: border 0.2s;
    background-color: #f9fafb;
    color: #111;
    font-weight: 500;
  }
  input:focus {
    outline: none;
    border-color: #2563eb;
    background-color: #fff;
  }
  
  /* Input yang tidak bisa diedit (hanya lihat) */
  input[readonly] {
    background-color: #f3f4f6;
    color: #1f2937;
    cursor: default;
  }

  /* ===== Input Barcode + tombol kamera ===== */
  .barcode-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .barcode-row input { flex: 1; }
  .btn-cam {
    width: 48px;
    min-width: 48px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .btn-cam:hover { background: #1d4ed8; }
  .btn-cam:active { transform: scale(0.95); }
  .btn-cam:disabled { background: #9ca3af; cursor: not-allowed; }

  /* Tombol Reset */
  .btn-row { display: flex; gap: 10px; margin-top: 16px; }
  button.btn-main {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  button.btn-main:active { transform: scale(0.97); }
  .btn-secondary { background: #e5e7eb; color: #374151; }
  .btn-secondary:hover { background: #d1d5db; }

  .status {
    padding: 12px 16px;
    font-size: 13px;
    text-align: center;
    border-radius: 8px;
    margin: 0 16px 12px;
    display: none;
  }
  .status.show { display: block; }
  .status.success { background: #dcfce7; color: #166534; }
  .status.error { background: #fee2e2; color: #991b1b; }
  .status.info { background: #dbeafe; color: #1e40af; }

  .last-scan {
    padding: 0 16px 16px;
    font-size: 13px;
    color: #6b7280;
    text-align: center;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🏷️ Cek Harga Barang</h1>
    <p>Scan barcode / QR Code untuk melihat harga</p>
  </header>

  <div class="status" id="status"></div>

  <div class="form-section">
    <div class="form-group">
      <label>Barcode / QR Code</label>
      <div class="barcode-row">
        <input type="text" id="barcode" placeholder="Scan atau ketik barcode..." autocomplete="off">
        <button class="btn-cam" id="camBtn" title="Scan dengan kamera">📷</button>
      </div>
    </div>
    
    <div class="form-group">
      <label>Nama Barang</label>
      <input type="text" id="nama" readonly placeholder="-">
    </div>
    
    <div class="form-group">
      <label>Harga Normal (Rp)</label>
      <input type="text" id="hargaNormal" readonly placeholder="-">
    </div>
    
    <div class="form-group">
      <label>Harga Promo (Rp)</label>
      <input type="text" id="hargaPromo" readonly placeholder="-">
    </div>
    
    <div class="form-group">
      <label>Stok Tersedia</label>
      <input type="text" id="stok" readonly placeholder="-">
    </div>

    <!-- Tombol Reset dikembalikan -->
    <div class="btn-row">
      <button class="btn-main btn-secondary" id="resetBtn">🔄 Bersihkan Layar</button>
    </div>
  </div>

  <div class="last-scan" id="lastScan"></div>
</div>

<!-- ===== Modal Scanner ===== -->
<div class="scanner-modal" id="scannerModal">
  <div class="scanner-box">
    <div class="scanner-header">
      <span>📷 Arahkan ke Barcode / QR</span>
      <button id="closeCamBtn" title="Tutup">✕</button>
    </div>
    <div class="video-wrap">
      <video id="video" playsinline muted></video>
      <div class="scan-overlay">
        <div class="scan-frame"></div>
        <div class="scan-hint">Posisikan barcode/QR di dalam kotak</div>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
// KONFIGURASI
// ============================================================
const API_URL = "https://script.google.com/macros/s/AKfycbyevpOdfxaKk7N1QkWljFWJm_KYaRFjOY5pUeVj5joITWVG26bo2Sjxu1m4ESXSTAxYkw/exec
"; 

// ============================================================
// ELEMEN
// ============================================================
const video = document.getElementById('video');
const camBtn = document.getElementById('camBtn');
const scannerModal = document.getElementById('scannerModal');
const closeCamBtn = document.getElementById('closeCamBtn');
const resetBtn = document.getElementById('resetBtn');
const statusEl = document.getElementById('status');
const lastScanEl = document.getElementById('lastScan');

const barcodeEl = document.getElementById('barcode');
const namaEl = document.getElementById('nama');
const hargaNormalEl = document.getElementById('hargaNormal');
const hargaPromoEl = document.getElementById('hargaPromo');
const stokEl = document.getElementById('stok');

let codeReader = null;
let isScanning = false;
let debounceTimer = null;
let streamRef = null;

// ============================================================
// STATUS
// ============================================================
function showStatus(msg, type = 'info') {
  statusEl.textContent = msg;
  statusEl.className = `status show ${type}`;
  if (type !== 'info') {
    setTimeout(() => statusEl.classList.remove('show'), 4000);
  }
}
function hideStatus() { statusEl.classList.remove('show'); }

// ============================================================
// FORMAT RUPIAH
// ============================================================
function formatRupiah(angka) {
  if (!angka && angka !== 0) return '-';
  return 'Rp ' + parseInt(angka).toLocaleString('id-ID');
}

// ============================================================
// KAMERA - BUKA
// ============================================================
async function openCamera() {
  try {
    scannerModal.classList.add('show');
    camBtn.disabled = true;
    isScanning = true;

    const constraints = {
      audio: false,
      video: {
        facingMode: { ideal: 'environment' },
        width:  { ideal: 1920, min: 1280 },
        height: { ideal: 1080, min: 720 },
        advanced: [{ focusMode: 'continuous' }]
      }
    };

    try {
      streamRef = await navigator.mediaDevices.getUserMedia(constraints);
    } catch (e) {
      streamRef = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: 'environment' } }
      });
    }

    video.srcObject = streamRef;
    await video.play();

    codeReader = new ZXing.BrowserMultiFormatReader();
    
    codeReader.hints = new Map([
      [ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.QR_CODE,
        ZXing.BarcodeFormat.EAN_13,
        ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.UPC_A,
        ZXing.BarcodeFormat.UPC_E,
        ZXing.BarcodeFormat.CODE_128,
        ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.ITF,
        ZXing.BarcodeFormat.CODABAR,
        ZXing.BarcodeFormat.DATA_MATRIX
      ]],
      [ZXing.DecodeHintType.TRY_HARDER, true]
    ]);

    codeReader.decodeFromVideoElement(video, (result, err) => {
      if (result && isScanning) {
        onBarcodeScanned(result.text);
      }
    });

  } catch (err) {
    console.error(err);
    showStatus('❌ Gagal akses kamera: ' + err.message, 'error');
    closeCamera();
  }
}

// ============================================================
// KAMERA - TUTUP
// ============================================================
function closeCamera() {
  isScanning = false;
  if (codeReader) {
    try { codeReader.reset(); } catch(e) {}
    codeReader = null;
  }
  if (streamRef) {
    streamRef.getTracks().forEach(t => t.stop());
    streamRef = null;
  }
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
  scannerModal.classList.remove('show');
  camBtn.disabled = false;
}

// ============================================================
// BARCODE TERBACA DARI KAMERA
// ============================================================
async function onBarcodeScanned(text) {
  if (!isScanning) return;
  isScanning = false;
  beep();
  closeCamera(); // Tutup otomatis setelah scan

  barcodeEl.value = text;
  lastScanEl.textContent = `Barcode terakhir: ${text}`;
  await lookupBarcode(text);
}

// ============================================================
// CARI HARGA KE SERVER
// ============================================================
async function lookupBarcode(text) {
  const barcode = String(text || '').trim();
  if (!barcode) return;

  // Reset form ke kosong sebelum mencari
  namaEl.value = '-';
  hargaNormalEl.value = '-';
  hargaPromoEl.value = '-';
  stokEl.value = '-';

  showStatus('🔍 Mencari harga...', 'info');

  try {
    const res = await fetch(API_URL + '?barcode=' + encodeURIComponent(barcode), {
      method: 'GET',
      mode: 'cors'
    });
    const data = await res.json();

    if (data.found && data.item) {
      namaEl.value = data.item.nama || '-';
      hargaNormalEl.value = formatRupiah(data.item.hargaNormal);
      hargaPromoEl.value = formatRupiah(data.item.hargaPromo);
      stokEl.value = data.item.stok !== undefined && data.item.stok !== "" ? data.item.stok : '-';
      
      showStatus('✅ Barang ditemukan', 'success');
    } else {
      showStatus('❌ Barang tidak ditemukan di database.', 'error');
    }
  } catch (err) {
    console.error(err);
    showStatus('⚠️ Gagal terhubung ke server. Cek koneksi internet.', 'error');
  }
}

// ============================================================
// FUNGSI RESET (BERSIHKAN LAYAR)
// ============================================================
function resetScreen() {
  // Hentikan timer pengetikan jika ada
  clearTimeout(debounceTimer);
  
  // Kosongkan input barcode
  barcodeEl.value = '';
  
  // Kembalikan form ke kondisi awal
  namaEl.value = '';
  hargaNormalEl.value = '';
  hargaPromoEl.value = '';
  stokEl.value = '';
  
  // Kosongkan info scan terakhir
  lastScanEl.textContent = '';
  
  // Sembunyikan pesan status
  hideStatus();
  
  // Fokuskan kursor ke input barcode agar siap scan/ketik lagi
  barcodeEl.focus();
}

// ============================================================
// BEEP
// ============================================================
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  } catch (e) {}
}

// ============================================================
// EVENT LISTENERS
// ============================================================
camBtn.addEventListener('click', openCamera);
closeCamBtn.addEventListener('click', closeCamera);
resetBtn.addEventListener('click', resetScreen); // Tombol reset diaktifkan

// Ketik manual → cek otomatis setelah 800ms berhenti mengetik
barcodeEl.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const val = barcodeEl.value.trim();
  
  if (val.length < 4) {
    namaEl.value = '';
    hargaNormalEl.value = '';
    hargaPromoEl.value = '';
    stokEl.value = '';
    return;
  }
  
  debounceTimer = setTimeout(() => {
    if (barcodeEl.value.trim() === val) {
      lookupBarcode(val);
    }
  }, 800);
});

// Enter di input barcode → langsung cek
barcodeEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    clearTimeout(debounceTimer);
    lookupBarcode(barcodeEl.value.trim());
  }
});

// Tutup modal jika klik di luar kotak
scannerModal.addEventListener('click', (e) => {
  if (e.target === scannerModal) closeCamera();
});

// Cek HTTPS
if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
  showStatus('⚠️ Kamera butuh HTTPS. Gunakan GitHub Pages.', 'error');
}
</script>
</body>
</html>
